<html lang="ru">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}

.icon-btn{background:none;color:white;font-size:20px;position:relative;padding:5px}

.lang-option:hover{background:#f5f5f5}

.burger{display:none;background:none;color:white;font-size:26px;cursor:pointer;padding:5px}

.hero-content{max-width:650px;z-index:2}

.btn-primary-hero{background:#d4af37;color:#0d1b2a;padding:16px 38px;border-radius:30px;font-weight:bold;font-size:15px;display:inline-flex;align-items:center;gap:10px;transition:all .3s;border:none}

.categories-section{padding:50px 40px;max-width:1400px;margin:0 auto}

.how-section{background:#f0f4f8;padding:60px 40px}

.how-step h4{font-size:14px;margin-bottom:5px}
.how-step p{font-size:12px;color:#666}

.btn-add-cart{width:100%;background:#0d1b2a;color:white;padding:10px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;margin-top:10px;transition:all .2s}

.reviews-section{background:#f8f9fa;padding:60px 40px}
.reviews-container{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.review-card{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:15px}
.review-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}

.review-date{font-size:12px;color:#888}
.review-stars{color:#d4af37;font-size:14px;margin-bottom:10px}
.review-text{font-size:13px;color:#555;line-height:1.6;margin-bottom:12px}
.review-img{width:80px;height:80px;background:#eee;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:40px}
.bottom-section{padding:60px 40px;max-width:1400px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:40px}

.social-block p{color:#666;font-size:14px;margin-bottom:20px}
.social-links{display:flex;gap:20px;margin-bottom:20px}
.social-link{display:flex;align-items:center;gap:10px}
.social-icon{width:45px;height:45px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.social-icon.instagram{background:linear-gradient(135deg,#f094fb,#ee4c8f);color:white}
.social-icon.tiktok{background:#000;color:white}
.social-link-text{font-size:13px}
.social-link-text strong{display:block}
.social-gallery{display:flex;gap:10px;overflow-x:auto}
.social-gallery-item{width:80px;height:80px;background:#eee;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:30px}
.footer{background:#0d1b2a;color:white;padding:50px 40px 20px}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1.5fr;gap:30px;max-width:1400px;margin:0 auto 30px}
.footer-logo{font-size:22px;font-weight:bold;letter-spacing:2px;margin-bottom:10px}
.footer-logo span{color:#d4af37}
.footer-slogan{font-size:13px;opacity:.8;margin-bottom:15px}
.social-icons{display:flex;gap:12px;font-size:20px}
.social-icons a{color:white;opacity:.8;transition:all .3s;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1)}
.social-icons a:hover{opacity:1;background:#d4af37;color:#0d1b2a;transform:translateY(-3px)}
.footer h4{font-size:14px;margin-bottom:15px;color:#d4af37}
.footer a{display:block;color:#aaa;font-size:13px;margin-bottom:8px;transition:color .3s}
.footer a:hover{color:#d4af37}
.subscribe-form{display:flex;margin-top:10px}
.subscribe-form input{flex:1;padding:10px;border:none;border-radius:6px 0 0 6px;font-size:13px}
.subscribe-form button{background:#d4af37;color:#000;padding:10px 15px;border-radius:0 6px 6px 0;font-weight:bold}
.footer-bottom{border-top:1px solid #1a2d42;padding-top:20px;display:flex;justify-content:space-between;font-size:12px;color:#888;max-width:1400px;margin:0 auto;flex-wrap:wrap;gap:10px}
.footer-bottom a{color:#888;margin-left:15px;display:inline}
.footer-bottom a:hover{color:#d4af37}
.info-page{max-width:900px;margin:40px auto;padding:40px;background:white;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.info-page h1{font-size:32px;margin-bottom:20px;color:#0d1b2a;border-bottom:3px solid #d4af37;padding-bottom:15px}
.info-page h2{font-size:22px;margin:25px 0 15px;color:#0d1b2a}
.info-page h3{font-size:18px;margin:20px 0 10px;color:#333}
.info-page p{font-size:15px;line-height:1.7;color:#555;margin-bottom:15px}
.info-page ul,.info-page ol{margin:15px 0 15px 30px;color:#555}
.info-page li{margin-bottom:8px;line-height:1.6}
.info-page .highlight{background:#fff9e6;padding:15px;border-left:4px solid #d4af37;border-radius:6px;margin:20px 0}
.breadcrumb{font-size:13px;color:#888;margin-bottom:20px}
.breadcrumb a{color:#667eea}
.breadcrumb a:hover{color:#d4af37}
.category-layout{display:grid;grid-template-columns:260px 1fr;gap:30px;max-width:1400px;margin:0 auto;padding:40px}
.filters-sidebar{background:white;border-radius:12px;padding:25px;height:fit-content;box-shadow:0 2px 10px rgba(0,0,0,.05);position:sticky;top:100px}
.filter-section{margin-bottom:25px;border-bottom:1px solid #eee;padding-bottom:20px}
.filter-title{font-size:15px;font-weight:bold;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.filter-title .arrow{transition:transform .3s}
.filter-title.collapsed .arrow{transform:rotate(-90deg)}
.filter-list{list-style:none}
.filter-list li{padding:8px 0;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:color .2s}
.filter-list li:hover{color:#d4af37}
.filter-list li.active{color:#d4af37;font-weight:bold}
.filter-list input[type="checkbox"]{margin-right:8px;accent-color:#d4af37}
.price-slider{width:100%;margin:15px 0;accent-color:#d4af37}
.price-range{display:flex;justify-content:space-between;font-size:12px;color:#666}
.btn-apply-filters{width:100%;background:#d4af37;color:#0d1b2a;padding:12px;border-radius:8px;font-weight:bold;margin-top:15px}
.constructor-choice-page{max-width:1200px;margin:40px auto;padding:40px}
.constructor-choice-header{text-align:center;margin-bottom:40px}
.constructor-choice-header h1{font-size:36px;margin-bottom:15px;color:#0d1b2a}
.constructor-choice-header h1 .gold{color:#d4af37}
.constructor-choice-header p{font-size:16px;color:#666}
.constructor-types-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:40px}
.constructor-type-card{background:white;border-radius:15px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.08);cursor:pointer;transition:all .3s;border:2px solid transparent;text-align:center}
.constructor-type-card:hover{transform:translateY(-8px);box-shadow:0 12px 30px rgba(0,0,0,.15);border-color:#d4af37}
.constructor-type-img{height:180px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:80px}
.constructor-type-content{padding:20px}
.constructor-type-content h3{font-size:18px;margin-bottom:8px;color:#0d1b2a}
.constructor-type-content p{font-size:13px;color:#666;margin-bottom:15px}
.constructor-type-btn{background:#d4af37;color:#0d1b2a;padding:10px 20px;border-radius:20px;font-weight:bold;font-size:13px;display:inline-block}
.constructor-steps-bar{display:flex;gap:10px;margin-bottom:30px;background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.c-step{flex:1;text-align:center;padding:15px;border-radius:8px;cursor:pointer;transition:all .3s;border:2px solid transparent}
.c-step.active{background:#d4af37;color:#0d1b2a;border-color:#d4af37}
.c-step-num{font-weight:bold;font-size:20px;margin-bottom:5px}
.c-step-title{font-size:13px}
.constructor-workspace{background:white;padding:30px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.05);min-height:400px}
.constructor-workspace h2{margin-bottom:20px;font-size:24px}
.upload-zone{border:2px dashed #d4af37;border-radius:12px;padding:60px;text-align:center;cursor:pointer;transition:all .3s;margin-bottom:20px;background:#fffef5}
.upload-zone:hover{background:#fff9e6}
.upload-zone .icon{font-size:60px;margin-bottom:15px}
.upload-zone h3{margin-bottom:10px}
.upload-zone p{color:#888;font-size:14px}
.photo-preview-container{width:100%;max-width:500px;margin:0 auto 20px;border-radius:12px;overflow:hidden;background:#f5f5f5;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.photo-preview-container img{max-width:100%;max-height:100%;object-fit:contain}
.editor-tools{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.editor-canvas{background:#f5f5f5;border-radius:10px;padding:20px;min-height:300px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.editor-canvas img{max-width:100%;max-height:400px;object-fit:contain;border-radius:8px}
.editor-controls{display:flex;flex-direction:column;gap:12px}
.editor-control-group label{display:block;font-weight:bold;margin-bottom:6px;font-size:13px}
.editor-control-group input,.editor-control-group select{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.size-options{display:flex;gap:10px;flex-wrap:wrap}
.size-option{padding:12px 18px;border:2px solid #ddd;border-radius:8px;cursor:pointer;text-align:center;transition:all .2s}
.size-option:hover{border-color:#d4af37}
.size-option.active{border-color:#d4af37;background:#fff9e6}
.size-option .size-name{font-weight:bold;font-size:14px}
.size-option .size-price{font-size:12px;color:#888;margin-top:3px}
.price-display{background:linear-gradient(135deg,#0d1b2a,#1a2d42);color:white;padding:20px;border-radius:10px;margin:20px 0;display:flex;justify-content:space-between;align-items:center}
.price-display .label{font-size:14px;opacity:.8}
.price-display .total{font-size:32px;font-weight:bold;color:#d4af37}
.btn-primary{background:#d4af37;color:#000;padding:12px;width:100%;border-radius:6px;font-weight:bold;font-size:16px;margin-bottom:10px}
.btn-primary:hover{background:#f4d03f}
.btn-whatsapp{background:#25D366;color:white;padding:14px;width:100%;border-radius:8px;font-weight:bold;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.btn-whatsapp:hover{background:#128C7E}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:2000;align-items:center;justify-content:center}
.modal.active{display:flex}
.modal-content{background:white;padding:30px;border-radius:12px;width:90%;max-width:700px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.close-modal{font-size:24px;cursor:pointer;background:none;border:none}
.form-group{margin-bottom:15px}
.form-group label{display:block;margin-bottom:5px;font-weight:bold;font-size:14px}
.form-group input,.form-group select{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px}
@media (max-width:1200px){.categories-grid{grid-template-columns:repeat(4,1fr)}.products-grid{grid-template-columns:repeat(3,1fr)}.footer-grid{grid-template-columns:repeat(3,1fr)}.how-container{grid-template-columns:1fr}.reviews-container{grid-template-columns:1fr}.bottom-section{grid-template-columns:1fr}.constructor-types-grid{grid-template-columns:repeat(2,1fr)}.editor-tools{grid-template-columns:1fr}.category-layout{grid-template-columns:1fr}.filters-sidebar{position:static}}
@media (max-width:768px){
  .header{padding:10px 15px;flex-wrap:wrap}
  .burger{display:block;order:1}
  .logo{order:2}
  .header-right{order:3}
  .nav{position:fixed;top:72px;left:0;right:0;background:#0d1b2a;flex-direction:column;padding:20px;display:none;gap:15px;box-shadow:0 10px 25px rgba(0,0,0,.3)}
  .nav.open{display:flex}
  .nav-dropdown-content{position:static;box-shadow:none;background:#1a2d42;margin-top:5px}
  .nav-dropdown-content a{color:white}
  .search-box{width:120px}
  .hero{padding:40px 20px;min-height:auto}
  .hero h1{font-size:32px}
  .hero-benefits{position:static;margin-top:30px}
  .categories-grid{grid-template-columns:repeat(2,1fr)}
  .products-grid{grid-template-columns:repeat(2,1fr)}
  .footer-grid{grid-template-columns:1fr}
  .constructor-types-grid{grid-template-columns:1fr}
}
</style>
</head>

<div style="display:flex;flex-direction:column;line-height:1">

</div>
</div>
